version: "3.9"

services:
  backend:
      build: ./backend
          ports:
                - "8000:8000"
                    env_file:
                          - .env
                              depends_on:
                                    - db
                                        volumes:
                                              - ./backend:/app

                                                frontend:
                                                    build: ./frontend
                                                        ports:
                                                              - "3000:3000"
                                                                  depends_on:
                                                                        - backend
                                                                            volumes:
                                                                                  - ./frontend:/app

                                                                                    db:
                                                                                        image: postgres:15
                                                                                            environment:
                                                                                                  POSTGRES_USER: ${POSTGRES_USER}
                                                                                                        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                                                                                                              POSTGRES_DB: ${POSTGRES_DB}
                                                                                                                  ports:
                                                                                                                        - "5432:5432"
                                                                                                                            volumes:
                                                                                                                                  - postgres_data:/var/lib/postgresql/data
                                                                                                                                  
                                                                                                                                  volumes:
                                                                                                                                    postgres_data:
